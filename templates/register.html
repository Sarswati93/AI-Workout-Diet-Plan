<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AI Workout & Diet Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="bg-layer"></div>
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="text-center mb-4">
            <div class="auth-icon">✨</div>
            <h1 class="fw-bold neon-text">Create Account</h1>
            <p class="text-light opacity-75 mb-0">Start your personalized fitness journey</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control glass-input" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control glass-input" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control glass-input" minlength="6" placeholder="Minimum 6 characters" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control glass-input" placeholder="Confirm your password" required>
            </div>
            <button class="btn btn-neon w-100 py-3 fw-bold" type="submit">Create Account</button>
        </form>

        <p class="text-center text-light opacity-75 mt-4 mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}" class="auth-link">Login</a>
        </p>
    </div>
</div>
</body>
</html>
